<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0D1B2E" />
  <meta name="description" content="CyberGuard AI — Intelligent Mobile Security Assistant for Indian smartphone users. Detect phishing, malware, data breaches, and Wi-Fi threats with AI-powered analysis." />

  <meta property="og:title" content="CyberGuard AI — Mobile Security Assistant" />

  <meta property="og:type" content="website" />
  
  <title>CyberGuard AI — Intelligent Mobile Security Assistant</title>
  
  <style>
    body {
      margin: 0;
      background-color: #0D1B2E;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    #root-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #E8F0FA;
    }
    
    #root-loader .shield {
      font-size: 48px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    #root-loader .text {
      margin-top: 16px;
      font-size: 14px;
      color: #8BA4C2;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run CyberGuard AI.</noscript>
  <div id="root">
    <div id="root-loader">
      <div class="shield">🛡️</div>
      <div class="text">Loading CyberGuard AI...</div>
    </div>
  </div>
</body>
